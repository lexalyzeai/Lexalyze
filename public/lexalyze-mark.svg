    />
    <path d="M305 175h102c8 0 12 4 8 10l-9 12H305z" fill="url(#gold)"/>
    <path d="M305 221h91c8 0 12 4 8 10l-9 12H305z" fill="url(#gold)" opacity=".96"/>
    <path d="M305 267h67c8 0 11 4 7 10l-8 12h-66z" fill="url(#gold)" opacity=".92"/>
  </g>
