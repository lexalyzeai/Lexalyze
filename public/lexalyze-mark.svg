<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Lexalyze mark</title>
  <desc id="desc">A gold Lexalyze L monogram inside a circular legal document mark.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="62%">
      <stop offset="0%" stop-color="#17130a"/>
      <stop offset="58%" stop-color="#080807"/>
      <stop offset="100%" stop-color="#030303"/>
    </radialGradient>
    <linearGradient id="gold" x1="105" y1="74" x2="416" y2="434" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff2a6"/>
      <stop offset="34%" stop-color="#e5c75b"/>
      <stop offset="68%" stop-color="#b98a2e"/>
      <stop offset="100%" stop-color="#f1d66d"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.86 0 1 0 0 0.65 0 0 1 0 0.18 0 0 0 0.45 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
